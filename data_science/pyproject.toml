[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
# CHANGED: This must match the name of your actual Python folder
name = "src" 
version = "0.0.1"
description = "Analysis and modelling of kirin inventory"
authors = [
  { name = "excent-one" },
]

# NOTE: Make sure a README.md exists in the data_science folder, 
# otherwise flit will throw an error when building.
readme = "README.md" 
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "==3.10.20"


[tool.ruff]
line-length = 99
# CHANGED: Point Ruff to the src folder
src = ["src"]
include = ["pyproject.toml", "src/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
# CHANGED: Tell Ruff that 'src' is your internal code
known-first-party = ["src"]
force-sort-within-sections = true